name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://vogler-consulting.ch
  CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm verify` runs the build, so dist/ is produced here as well.
      - run: pnpm verify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A green deploy only means the artifact was published. It does not mean the
  # live site is serving it, so check the real domain before calling it done.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        env:
          BASE: https://vogler-consulting.ch
        run: |
          set -uo pipefail
          fail=0

          # Pages needs a moment to start serving the new artifact.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/" || echo 000)
            [ "$code" = "200" ] && break
            echo "waiting for the deployment, homepage returned $code (attempt $attempt)"
            sleep 15
          done

          status() {
            code=$(curl -sSL -o /dev/null -w '%{http_code}' "$BASE$1" || echo 000)
            if [ "$code" = "200" ]; then echo "ok    $1"
            else echo "FAIL  $1 returned $code"; fail=1; fi
          }
          contains() {
            if curl -sSL "$BASE$1" | grep -qF -- "$2"; then echo "ok    $1 contains \"$2\""
            else echo "FAIL  $1 is missing \"$2\""; fail=1; fi
          }
          absent() {
            if curl -sSL "$BASE$1" | grep -qF -- "$2"; then echo "FAIL  $1 still contains \"$2\""; fail=1
            else echo "ok    $1 free of \"$2\""; fi
          }

          for path in / /en /about /en/about /team /en/team /careers /en/careers \
                      /services /en/services /services/ai-roadmap /en/services/ai-roadmap \
                      /workshops/agentic-ai /impressum /datenschutz \
                      /sitemap-index.xml /robots.txt /llms.txt; do
            status "$path"
          done

          # Content assertions, not just reachability.
          contains / "info@vogler-consulting.ch"
          absent   / "daniel@vogler-consulting.ch"
          contains /services/ai-roadmap "AI Roadmap"
          contains /careers "Karriere"
          contains /en/careers "Careers"

          if [ "$fail" -ne 0 ]; then
            echo "::error::The deployment published but the live site failed its checks."
            exit 1
          fi
          echo "live site verified"
